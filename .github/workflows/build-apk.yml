name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java_version=$(java -version 2>&1 | grep -oP 'version "\K[0-9]+')
          if [ "$java_version" -lt 17 ]; then
            echo "Error: Java 17 or newer is required."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f debug.keystore ]; then
            echo "Error: debug.keystore could not be created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found!"
            ls -R app/build/outputs/apk/
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/app-debug.apk
          echo "asset_path=release_assets/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          asset_path="${{ steps.prepare_release.outputs.asset_path }}"
          if [ ! -f "$asset_path" ] || [ ! -s "$asset_path" ]; then
            echo "APK asset invalid!"
            exit 1
          fi
          
          tag="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          gh release create "$tag" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "This is an automatically generated debug APK.
            The APK was built by GitHub Actions.
            GitHub Actions run number: ${{ github.run_number }}
            GitHub Actions run attempt: ${{ github.run_attempt }}
            Source commit SHA: ${{ github.sha }}
            APK is intended for testing.
            APK is not a Play Store production release.
            APK is signed only with a temporary debug keystore." \
            --latest \
            "$asset_path"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "Release published successfully."
            gh release view "debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            
            echo "DIRECT APK DOWNLOAD: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          else
            echo "Release publishing failed."
            echo "The Actions artifact named app-debug-apk remains available."
          fi
